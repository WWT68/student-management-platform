<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="教师注册页面 - 需要管理员审核">
    <title>教师注册 - 高校学籍管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .register-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .register-card {
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .register-header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 2rem;
            border-radius: 16px 16px 0 0;
            text-align: center;
        }
        .register-icon {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.15);
        }
        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
    </style>
<base target="_blank">
</head>
<body>

<div class="register-container d-flex justify-content-center align-items-center p-3">
    <div class="card register-card">
        <div class="register-header">
            <div class="register-icon">
                <i class="bi bi-person-badge"></i>
            </div>
            <h4 class="mb-1">教师账号注册</h4>
            <p class="mb-0 opacity-75">需要管理员审核后方可使用</p>
        </div>
        
        <div class="p-4">
            <!-- 提示信息 -->
            <div class="info-box">
                <i class="bi bi-info-circle-fill text-warning me-2"></i>
                <small>教师账号注册后需要管理员审核，审核通过后方可登录使用。</small>
            </div>
            
            <!-- Flash 消息 -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form action="/register_teacher" method="POST" novalidate>
                <div class="mb-3">
                    <label for="teacher_id" class="form-label fw-bold">
                        <i class="bi bi-person-vcard me-1 text-success"></i>教师工号
                    </label>
                    <input 
                        type="text" 
                        id="teacher_id"
                        name="tid" 
                        class="form-control" 
                        placeholder="请输入教师工号" 
                        required
                        autofocus
                    >
                    <div class="form-text text-muted">工号将作为登录账号</div>
                </div>
                
                <div class="mb-3">
                    <label for="teacher_name" class="form-label fw-bold">
                        <i class="bi bi-person me-1 text-success"></i>教师姓名
                    </label>
                    <input 
                        type="text" 
                        id="teacher_name"
                        name="tname" 
                        class="form-control" 
                        placeholder="请输入真实姓名" 
                        required
                    >
                </div>
                
                <div class="mb-3">
                    <label for="dept_id" class="form-label fw-bold">
                        <i class="bi bi-building me-1 text-success"></i>所属院系
                    </label>
                    <select id="dept_id" name="did" class="form-select" required>
                        <option value="">请选择院系</option>
                        {% for dept in departments %}
                            <option value="{{ dept[0] }}">{{ dept[1] }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">
                        <i class="bi bi-lock me-1 text-success"></i>设置密码
                    </label>
                    <input 
                        type="password" 
                        id="password"
                        name="password" 
                        class="form-control" 
                        placeholder="长度不少于6位" 
                        required
                        minlength="6"
                    >
                    <div class="form-text text-muted">密码长度至少6位</div>
                </div>
                
                <button type="submit" class="btn btn-success w-100 mb-3 fw-bold">
                    <i class="bi bi-check-circle me-1"></i>提交注册申请
                </button>
                
                <div class="text-center">
                    <a href="/login" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i>返回登录页面
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
