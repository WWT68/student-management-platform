<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="高校学籍管理系统登录页面">
    <title>高校学籍管理系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <style>
        .login-container {
            min-height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            border: none;
        }
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            border: none;
            background: none;
            padding: 0;
        }
        .password-toggle:hover {
            color: #495057;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center login-container">
    <div class="card p-4 shadow-sm login-card">
        <h3 class="text-center text-primary mb-4">高校学籍管理系统</h3>
        
        <!-- 错误提示区域 -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        

        
        <form action="/login" method="POST" novalidate>
            <!-- CSRF 保护 -->
            {% if csrf_token %}
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            {% endif %}
            
            <div class="mb-3">
                <label for="account" class="form-label fw-bold">登录账号</label>
                <input 
                    type="text" 
                    id="account"
                    name="account" 
                    class="form-control" 
                    placeholder="请输入学号/工号" 
                    required
                    autocomplete="username"
                    autofocus
                >
                <div class="form-text text-muted">学生请使用学号登录</div>
                <div class="invalid-feedback">请输入登录账号</div>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label fw-bold">登录密码</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password"
                        name="password" 
                        class="form-control" 
                        placeholder="请输入密码" 
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="显示/隐藏密码">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="invalid-feedback">请输入登录密码</div>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label" for="remember">记住我</label>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3 fw-bold">
                <i class="bi bi-box-arrow-in-right me-1"></i>登 录
            </button>
            
            <div class="text-center">
                <div class="mb-2">
                    <a href="/register" class="text-decoration-none text-muted small">学生注册</a>
                    <span class="text-muted mx-2">|</span>
                    <a href="/register_teacher" class="text-decoration-none text-muted small">教师注册</a>
                </div>
                <small class="text-muted">教师注册需要管理员审核</small>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 密码显示/隐藏切换
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    });
    
    // 表单验证
    (function() {
        'use strict';
        const forms = document.querySelectorAll('form');
        
        Array.from(forms).forEach(function(form) {
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>

</body>
</html>
